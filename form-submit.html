    <style>
        body { font-family: 'Manrope', sans-serif !important; }
        .success-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }
        .success-box {
            background: #fff;
            border-radius: 20px;
            padding: 60px 80px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            animation: popIn 0.5s ease;
            max-width: 500px;
            width: 100%;
        }
        .success-box .tick-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            animation: scaleUp 0.6s ease 0.2s both;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.3);
        }
        .success-box .tick-circle svg {
            width: 60px;
            height: 60px;
        }
        .success-box .tick-circle .tick-path {
            stroke: #fff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawTick 0.5s ease 0.8s forwards;
        }
        .success-box h2 {
            color: #1e2754;
            font-size: 28px;
            margin: 10px 0 10px;
            font-weight: 800;
        }
        .success-box p {
            color: #666;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .success-box .redirect-text {
            color: #0c93cd;
            font-size: 14px;
            font-weight: 600;
        }
        .success-box .countdown {
            color: #1e2754;
            font-size: 32px;
            font-weight: 800;
            margin: 10px 0;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes scaleUp {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        @keyframes drawTick {
            to { stroke-dashoffset: 0; }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .success-box { animation: popIn 0.5s ease, pulse 2s ease 1.5s infinite; }
    </style>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyB31-OgQ9uce_H1rCT5TWPF-b-Ba8u49XY",
            authDomain: "loan-123-2cc55.firebaseapp.com",
            projectId: "loan-123-2cc55",

        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        var db = firebase.firestore();
        $(document).ready(function() {
            var phone = localStorage.getItem('loan112_mobile');
            if (phone) {
                db.collection('users').doc(phone).get().then(function(doc) {
                    if (doc.exists && doc.data().company_name) {
                        $('#nav-company-name').text(doc.data().company_name);
                    } else {
                        $('#nav-company-name').text('USER');
                    }
                }).catch(function() {
                    $('#nav-company-name').text('USER');
                });
            } else {
                $('#nav-company-name').text('USER');
            }
        });
    </script>
    <script>
        var seconds = 3;
        var countdownEl = document.getElementById('countdown');
        var timer = setInterval(function() {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = 'user-report.html';
            }
        }, 1000);
    </script>
